name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and verify docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build debug APK and run JVM tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Verify generated Markdown is current
        shell: bash
        run: |
          python .python/generate_markdown.py
          git diff --exit-code -- .

          generated_untracked_files="$(git ls-files --others --exclude-standard)"
          if [[ -n "$generated_untracked_files" ]]; then
            printf 'Unexpected untracked files after Markdown generation:\n%s\n' "$generated_untracked_files"
            exit 1
          fi
